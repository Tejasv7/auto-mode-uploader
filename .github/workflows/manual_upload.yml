name: 🎬 Input YouTube Video Link (AI Long-to-Shorts)

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: '🔗 Paste YouTube Video URL (e.g. https://www.youtube.com/watch?v=...)'
        required: true
        type: string
      clips:
        description: '🎯 Number of Clips to Extract'
        required: true
        default: '8'
        type: choice
        options:
          - '4'
          - '8'
          - '12'
          - '16'
          - '24'
      upload_action:
        description: '⚡ Upload Action'
        required: true
        default: 'queue_and_upload_first'
        type: choice
        options:
          - 'queue_and_upload_first'
          - 'queue_only'
          - 'upload_all_now'
      privacy:
        description: '🔒 YouTube Privacy'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private

permissions:
  contents: write

jobs:
  process_video:
    name: Analyze & Clip Video
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Credentials & Environment from GitHub Secrets
        run: |
          mkdir -p config
          if [ -n "${{ secrets.YOUTUBE_CLIENT_SECRETS }}" ]; then
            echo '${{ secrets.YOUTUBE_CLIENT_SECRETS }}' > config/client_secrets.json
          fi
          if [ -n "${{ secrets.YOUTUBE_TOKEN }}" ]; then
            echo '${{ secrets.YOUTUBE_TOKEN }}' > config/token.json
          fi
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "ENABLE_ANTI_COPYRIGHT=true" >> .env
          echo "SPEED_MULTIPLIER=1.04" >> .env
          echo "COLOR_BOOST=true" >> .env
          echo "AUTO_DELETE_AFTER_UPLOAD=true" >> .env

      - name: Run AI Video Analyzer & Clipper
        run: |
          echo ">>> Processing YouTube URL: ${{ github.event.inputs.youtube_url }}"
          
          if [ "${{ github.event.inputs.upload_action }}" = "queue_and_upload_first" ]; then
            python main.py --url "${{ github.event.inputs.youtube_url }}" --clips ${{ github.event.inputs.clips }} --upload --privacy ${{ github.event.inputs.privacy }}
          elif [ "${{ github.event.inputs.upload_action }}" = "upload_all_now" ]; then
            python main.py --url "${{ github.event.inputs.youtube_url }}" --clips ${{ github.event.inputs.clips }} --upload-all --privacy ${{ github.event.inputs.privacy }}
          else
            python main.py --url "${{ github.event.inputs.youtube_url }}" --clips ${{ github.event.inputs.clips }} --privacy ${{ github.event.inputs.privacy }}
          fi

      - name: Sync & Commit Queue Updates back to GitHub
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add clip_queue.json history.json || true
          git commit -m "chore(queue): updated clips queue from cloud runner [skip ci]" || echo "No queue changes to commit"
          git push origin main || echo "Nothing to push"
