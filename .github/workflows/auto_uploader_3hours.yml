name: 🚀 24/7 Auto-Mode Uploader (Every 3 Hours)

on:
  schedule:
    # Runs every 3 hours (8 times every 24 hours): 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      privacy:
        description: 'Upload Privacy'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private

jobs:
  upload_slot:
    name: Auto Upload Next Queued Short
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & System Fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload Next Queued Clip
        run: |
          echo ">>> [3-HOUR SLOT] Executing automated YouTube Short upload..."
          python main.py --upload-next --privacy ${{ github.event.inputs.privacy || 'public' }}
