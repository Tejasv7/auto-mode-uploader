name: ⏰ 24/7 Cloud Auto-Uploader (Every 3 Hours)

on:
  schedule:
    # Runs every 3 hours (8 times in 24 hours): 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      privacy:
        description: 'Upload Privacy'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private

permissions:
  contents: write

jobs:
  auto_upload:
    name: Upload Next Queued Short
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & System Fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Credentials & Environment from GitHub Secrets
        run: |
          mkdir -p config
          if [ -n "${{ secrets.YOUTUBE_CLIENT_SECRETS }}" ]; then
            echo '${{ secrets.YOUTUBE_CLIENT_SECRETS }}' > config/client_secrets.json
          fi
          if [ -n "${{ secrets.YOUTUBE_TOKEN }}" ]; then
            echo '${{ secrets.YOUTUBE_TOKEN }}' > config/token.json
          fi
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "ENABLE_ANTI_COPYRIGHT=true" >> .env
          echo "SPEED_MULTIPLIER=1.04" >> .env
          echo "COLOR_BOOST=true" >> .env
          echo "AUTO_DELETE_AFTER_UPLOAD=true" >> .env

      - name: Upload Next Clip from Queue
        run: |
          echo ">>> [3-HOUR CLOUD SLOT] Uploading next clip..."
          python main.py --upload-next --privacy ${{ github.event.inputs.privacy || 'public' }}

      - name: Sync & Commit Queue Updates back to GitHub
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add clip_queue.json history.json || true
          git commit -m "chore(queue): updated 3-hour queue progress [skip ci]" || echo "No queue changes"
          git push origin main || echo "Nothing to push"
